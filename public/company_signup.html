<!DOCTYPE html>
<html>
<head>
  <title>Company Signup</title>
  <style>
      body {
        font-family: Arial, sans-serif;
        background-image: url(blackred.jpg);
        margin: 0;
        padding: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        height: 100vh;
      }

      h2 {
        margin-bottom: 20px;
        color: snow;
      }

      .sign {
        padding: 30px;
        background-color: black;
        border: 2px solid #ccc;
        border-radius: 10px;
        box-shadow: 5px 10px;
        width: 300px;
      }

      label {
        display: block;
        margin-top: 15px;
        font-weight: bold;
        color: crimson;
      }

      input {
        width: 100%;
        padding: 8px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 5px;
      }

      button {
        margin-top: 20px;
        padding: 10px;
        width: 100%;
        background-color: crimson;
        color: white;
        border: none;
        border-radius: 5px;
        cursor: pointer;
        font-size: 16px;
      }

      a {
        color: snow;
      }

      button:hover {
        background-color: darkred;
      }

      .role-selection {
    display: flex;
    justify-content: space-between;
    margin-top: 10px;
    gap: 10px;
  }

  .role-selection input[type="radio"] {
    display: none;
  }

  .role-option {
    flex: 1;
    text-align: center;
    padding: 10px;
    border: 1px solid #ccc;
    border-radius: 5px;
    background-color: white;
    color: black;
    cursor: pointer;
    font-weight: bold;
    transition: 0.3s ease;
  }

  .role-selection input[type="radio"]:checked + .role-option {
    background-color: crimson;
    color: white;
    border-color: crimson;
  }
    </style>
</head>
<body>
  <h2><strong>Sign-Up</strong></h2>
  <div class="sign">
  <form action="/company_signup" method="POST">
    <label>Company Name:</label><br>
    <input type="text" name="name" required><br><br>

    <label>Email:</label><br>
    <input type="email" name="email" required><br><br>

    <label>Password:</label><br>
    <input type="password" name="password" required><br><br>

    <button type="submit">Sign Up</button>
  </form><br>
  <a href="company_login.html">Already have an account?</a>
</body>
</html>
