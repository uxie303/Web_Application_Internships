<!DOCTYPE html>
<html>
<head>
  <title>Student Sign-Up</title>
<style>
    body {
      font-family: Arial, sans-serif;
      background-image: url(blackred.jpg);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h2 {
      margin-bottom: 20px;
      color: snow;
    }

    .sign {
      padding: 30px;
      background-color: black;
      border: 2px solid #ccc;
      border-radius: 10px;
      box-shadow: 5px 10px;
      width: 300px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: crimson;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background-color: crimson;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    a {
      color: snow;
    }

    button:hover {
      background-color: darkred;
    }


  </style>
</head>
<body>

<h2><strong>Sign-Up</strong></h2>
<div class="sign">
<form action="/student_signup" method="POST">
  <label for="name">Name:</label>
  <input type="text" id="name" name="name" required><br><br>

  <label for="email">Email:</label>
  <input type="email" id="email" name="email" required><br><br>

  <label for="stu_password">Password:</label>
  <input type="text" id="stu_password" name="stu_password" required><br><br>

  <label for="course">Course:</label>
  <input type="text" id="course" name="course" required><br><br>

  <button type="submit">Sign up</button>
</form><br>
<a href="student_login.html">Already have an account?</a>

</div>
</body>
</html>
