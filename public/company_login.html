<!DOCTYPE html>
<html>
<head>
  <title>Company Login</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-image: url(blackred.jpg);
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }

    h2 {
      margin-bottom: 20px;
      color: White;
    }

    .sign {
      padding: 30px;
      background-color: black;
      border: 2px solid #ccc;
      border-radius: 10px;
      box-shadow: 5px 10px;
      width: 300px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      color: crimson;
    }

    input {
      width: 100%;
      padding: 8px;
      margin-top: 5px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }

    button {
      margin-top: 20px;
      padding: 10px;
      width: 100%;
      background-color: crimson;
      color: white;
      border: none;
      border-radius: 5px;
      cursor: pointer;
      font-size: 16px;
    }

    button:hover {
      background-color: darkred;
    }

     a {
      color: snow;
    }
  </style>
</head>
<body>
  <h2><strong>Login</strong></h2>
  <div class="sign">
  <form id="companyloginform">
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" required><br><br>

    <label for="password">Password:</label>
    <input type="password" id="password" name="password" required><br><br>

    <button type="submit">Log In</button>
  </form><br>
  <a href="company_signup.html">Dont have an account?</a>
</div>

<script>
  document.getElementById('companyloginform').addEventListener('submit', function (event) {
    event.preventDefault();

    const formData = new FormData(this);
    const data = new URLSearchParams(formData);

    fetch('/company_login', {
      method: 'POST',
      body: data
    })
    .then(res => res.text())
    .then(response => {
      if (response.includes("Invalid credentials")) {
        alert("Invalid credentials. Please try again.");
      } else {
        window.location.href = "/company_home";
      }
    })
    .catch(error => {
      console.error('Login error:', error);
      alert('Something went wrong. Try again.');
    });
  });
</script>



</body>
</html>
